# Example /etc/scrim/agent.yaml. The keys are the flags of
# `scrim agent`; see `scrim agent --help`.

# The control plane's node-listen address, and the join token from
# `scrim token show join` on the control plane's machine.
server: cp.example.com:9445
token-file: /etc/scrim/join-token

node-name: node-2
address: 203.0.113.11
min-port: 7000
max-port: 8000
