<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 662 112" role="img" aria-label="agones-lite">
  <title>agones-lite</title>
  <!--
    The agones-lite logo. The mark is the letter A as the Greeks wrote it
    without its bar, over one dot: a single game server that is Ready.
    The letters are lines and arcs with round ends, one to a line below, so
    that no font is needed. This file is for dark backgrounds.
  -->
