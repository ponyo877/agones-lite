<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 392 112" role="img" aria-label="scrim">
  <title>scrim</title>
<!--
  The scrim logo. A scrim is a practice match. The mark is its two sides,
  facing each other, and between them one dot: a game server that is Ready.
  The letters are lines and arcs with round ends, one to a line below, so
  that no font is needed. This file is for light backgrounds.
-->
