name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Some tests feed the upstream sample manifests to our API.
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint (complexity, function length, nesting)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Test
        run: go test ./...

  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean (the version named in formal/lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check every proof
        working-directory: formal
        run: lake build
      - name: The vectors in the repository are what the models answer
        working-directory: formal
        run: lake exe vectors && git diff --exit-code -- vectors
