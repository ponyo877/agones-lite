name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Some tests feed the upstream sample manifests to our API.
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Lint (complexity, function length, nesting)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: Test
        run: go test ./...
