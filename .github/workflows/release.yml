name: release

# Pushing a tag such as v1.0.0 builds the binaries, attaches them to a GitHub
# release, and pushes the sidecar image with the same tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the binaries
        run: make dist VERSION=${{ github.ref_name }}

      - name: Attach them to the release
        run: gh release create "${{ github.ref_name }}" dist/agones-lite-* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the sidecar image for both architectures
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "ghcr.io/${{ github.repository }}-sidecar:${{ github.ref_name }}" \
            --file build/sidecar/Dockerfile.release dist
