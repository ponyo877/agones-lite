name: release

# Pushing a tag such as v1.0.0 builds the binaries, attaches them to a GitHub
# release, and pushes the sidecar image with the same tag.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Build the binaries
        run: make dist VERSION=${{ github.ref_name }}

      - name: Attach them to the release
        run: gh release create "${{ github.ref_name }}" dist/agones-lite-* --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push the sidecar image for both architectures
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --tag "ghcr.io/${{ github.repository }}-sidecar:${{ github.ref_name }}" \
            --file build/sidecar/Dockerfile.release dist
