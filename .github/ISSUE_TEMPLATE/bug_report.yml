name: Something does not work
description: scrim does something other than what it says, or than Agones does.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: A difference from Agones that the design document does not mention is a bug, too.
    validations:
      required: true
  - type: textarea
    id: how
    attributes:
      label: How can it be seen?
      description: The commands, and the manifest if there is one. The output of "scrim describe" has the events of a game server.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: What "scrim version" prints, or the commit.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where it runs
      description: Operating system, architecture, and what "docker version" says of the server.
      placeholder: Ubuntu 24.04 on arm64, Docker 29
